[platformio]
; ============================================================================
;  ★ 选型速查（烧录前先看这里，别凭记忆挑 env）
; ============================================================================
;
;  env 名规约： <机型>[_ICM45686][_MAVLink][_Flight]
;    · 机型   必选： TandemVec_FCS（纵列双发，默认机型）/ CoaxialVTVL（共轴双桨）/
;                    SingleEdf4Vane（单涵道四燃气舵）
;    · IMU    可选： _ICM45686（缺省 = ICM-42688-P）
;    · 协议   可选： _MAVLink（缺省 = AnoCom，配本项目 GCS）
;    · 用途   可选： _Flight（缺省 = 调试版，带 DBG 控制台与诊断帧）
;
;  四个维度**相互独立**，可任意组合；新增一个组合只需两行（见文件末「新增组合」）。
;
;  当前实机 → default_envs = CoaxialVTVL_ICM45686
;  ★ 换机型/换板必须同步改这一行：`pio run -t upload` 不带 -e 时用它，
;    写错等于把板子刷成别的机型（2026-11-06 就因此出过一次）。
;
;  ┌────────────────────────┬──────────────────────────────────────────────┐
;  │ env                    │ 用途                                          │
;  ├────────────────────────┼──────────────────────────────────────────────┤
;  │ TandemVec_FCS          │ 纵列双发 · 42688 · AnoCom · 调试               │
;  │ TandemVec_FCS_ICM45686 │ 纵列双发 · 45686 · AnoCom · 调试               │
;  │ CoaxialVTVL            │ 共轴双桨 · 42688 · AnoCom · 调试               │
;  │ CoaxialVTVL_ICM45686   │ 共轴双桨 · 45686 · AnoCom · 调试  ← 当前实机    │
;  │ SingleEdf4Vane         │ 单涵道   · 42688 · AnoCom · 调试               │
;  │ SingleEdf4Vane_ICM45686│ 单涵道   · 45686 · AnoCom · 调试               │
;  │ SingleEdf4Vane_Flight  │ 单涵道   · 42688 · AnoCom · 实飞（去调试开销）  │
;  │ *_ICM45686_MAVLink ×3  │ 上表对应机型 · 45686 · MAVLink（QGC/MP 可连）   │
;  │ test                   │ 板载自检固件（≠ 宿主回归，见文件末）           │
;  └────────────────────────┴──────────────────────────────────────────────┘
;
;  烧录：pio run -e <env> -t upload      串口监视：pio device monitor -e <env>
;  编译产物互不覆盖（各自 .pio/build/<env>/），换 env 不需要 clean。
; ============================================================================
default_envs = CoaxialVTVL_ICM45686


[env]
; DAPLink（cmsis-dap）烧录速率：必须降到 20–100 kHz。
;   高速下偶发 checksum mismatch（diff 为孤立位翻转），那是链路误码不是固件坏
;   （2026-11-03 实测：降到 20–100 kHz 后稳定 Verified OK）。这里统一取 100 kHz。
;   烧录失败先降速复测，不要急着重编译固件。各 env 可单独覆盖 upload_speed。
upload_speed = 100000


; ============================================================================
;  ① 上层：机型无关基座 unignc
; ----------------------------------------------------------------------------
;  这里只放「三个机型共用」的东西：板级、CPU/FPU、编译优化、调度时基、
;  IMU 采样架构、导航/EKF 宏、看门狗。**任何机型差异都不许写在这一段**——
;  机型差异只允许出现在 ② 机型层的 -DBFS_xxx 上。
;
;  新增机型 = 加一个 `extends = env:unignc` + 一个机型宏，不许复制本段。
; ============================================================================
[env:unignc]
platform = ststm32@20.0.0
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
; upload_protocol = jlink
; 串口监视器默认波特率（Serial6 地面站口；固件侧 SERIAL6_BAUDRATE 也是 921600）
monitor_speed = 921600

build_flags =
    ; ---- 1. Cortex-M7 + 硬件双精度 FPU ----
    -mcpu=cortex-m7
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -mvectorize-with-neon-quad
    -O3
    -DNDEBUG
    -DTANDEMVEC_FIRMWARE ; 固件编译：kFlightCtrlParams 为可变唯一实例（FlightCtrlParams.h / state_data.cpp）
    -Wall
    -Wno-address-of-packed-member ; MAVLink 生成头对 packed 数组成员取地址，按第三方库边界定向压制
    -Wno-psabi          ; Eigen 模板在 GCC 7.1 后的 ARM 参数传递 ABI 提示

    ; ---- 2. 串口缓冲 ----
    -DSERIAL_RX_BUFFER_SIZE=16384
    -DSERIAL_TX_BUFFER_SIZE=4096

    ; ---- 3. 调度器 ----
    ; 2kHz 调度器支持小数 tick 间隔。DPS310 上板实测 7.735ms 任务周期，
    ; 配合压力优先补读贴近 128Hz 压力输出，300s 内无 FIFO overflow/flush。
    -DBFS_TASK_FRACTIONAL_INTERVALS
    ; 任务调度画像（每 2s 输出 [TASK]/[LOOP] 统计表，仅 DBG 模式打印）
    -DBFS_TASK_PROFILE
    -DBFS_PROFILE_TO_ANOCOM_SERIAL
    -DBFS_NAV_PROFILE

    ; ---- 4. 气压计 DPS310 ----
    -DBFS_DPS310_FIFO_MAX_READS=2U
    -DBFS_DPS310_STOP_AFTER_PRESSURE_SAMPLE

    ; ---- 5. 硬件看门狗（IWDG，main.cpp 的 initIwdg/kickIwdg）----
    -DHAL_IWDG_MODULE_ENABLED

    ; ---- 6. 导航/EKF ----
    ; ★2026-10-31 审计 P1-8：_STABILIZE / _PROPAGATION 快速数值路径已从飞行构建移除。
    ;   导航库源码自述该路径"仅 bring-up、闭环前必须重新验证"，而 [env:test]、
    ;   test_host 与 SIL 都不定义这两个宏 —— 移除后飞行二进制与回归基线一致（double 路径）。
    ;   若要恢复，必须先把 float 路径纳入宿主回归并加协方差正定性断言。
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_STABILIZE
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_PROPAGATION
    ; ★2026-11-03 协方差传播中间量改 float：Phi·P·Phiᵀ 与 Simpson Qd 的公式/顺序
    ;   完全不变，只替换中间计算精度（非 FAST_PROPAGATION 近似路径）。
    ;   验证：EKF 116 项回归双路径全过；上板 cov_avg 5203→966 µs、Navigation avg 5657→1519 µs。
    -DBFS_NAVIGATION_EMBEDDED_FLOAT_COVARIANCE=1

    ; 气压高度 EKF 观测：DPS310 先以起飞点归零，再用 Home WGS84 高度恢复为绝对观测，
    ; 与 GNSS 共用同一 LLA 高度基准。H=[0,0,1,0,...]。
    -DBFS_EKF_BARO_ALTITUDE_UPDATE
    -DBFS_EKF_Z_BIAS_TUNING
    ; ★2026-10-31 审计 P1-5：气压健康门控（Drift/Spike/Stuck → Suspect）。
    ;   此前宏未定义 ⇒ g_baro_health_gate_enable 恒 false，监测器只写遥测不生效；
    ;   DPS310 冻结时 baro R=0.1225 仍以约 73:1 权重压过 GNSS 高度（R≥9）。
    -DBFS_BARO_HEALTH_GATE

    ; ---- 7. IMU 采样架构（P1，三机型统一）----
    ; ★ 2026-11-06 统一下沉：2kHz TIM8 ISR 单包入 SPSC ring，Navigation 200Hz
    ;   按 elapsed 限流排空；备份姿态 200Hz 由 BFS_IMU_ATT_DECIMATE 分频。
    ;   ★ 45686 构建同样需要这两个宏（3.2kHz FIFO 单包 + ISR 每 2 拍取一包），
    ;     绝不能用 -U 取消 —— 那是 200Hz 轮询回退路径（用户 2026-11-10 明确拒绝）。
    -DBFS_IMU_ISR_RING
    -DBFS_IMU_ATT_DECIMATE

    ; ---- 8. IMU 型号 ----
    ; 本层不定义 = 默认 ICM-42688-P（2kHz 硬件 FIFO）。
    ; 换 ICM-45686 时在**子 env** 加 -DFCS_IMU_MODEL_ICM45686（3.2kHz FIFO 单包）。
    ; ★ ICM-45686 无 2000Hz 档（序列 ...1600/3200/6400），调度器的 IMU 任务周期与
    ;   Madgwick 更新率由 actualAccelOdrHz() 反推（见 main.cpp），不再写死 2kHz。
    ;   换型后必须复核 EKF 的 IMU 降采样假设。


; ============================================================================
;  ② 机型层：只差一个机型宏
; ============================================================================
;
; 三类机型的三轴力矩分配、混控输出、执行器映射完全不同，其余全部共用：
; 板级/任务/导航/EKF/姿态环/速率环一份代码。机型宏之间**编译期互斥**
; （FlightCtrlParams.h 有 #error 保护），不会同时定义两个。

; 纵列双发矢量推力（基型，2026-08 实飞验证）
; 上摆 δf=滚转、下摆 δt=俯仰、差速 Δω=偏航（悬停构型语义）。
[env:TandemVec_FCS]
extends = env:unignc

; 共轴双桨 VTVL
; 复用同一板级/任务/导航，仅把 GNC 控制/混控切换为 CoaxialVtvControl + mapCoaxialVtvOutputs。
; ★ 架构：P1（2kHz ISR 单包入 ring，Navigation 200Hz 排空；备份姿态 200Hz）。
[env:CoaxialVTVL]
extends = env:unignc
build_flags = ${env:unignc.build_flags} -DBFS_COAXIAL_VTVL
    ; A/B 结论（2026-11-10）：backup_ahrs(Madgwick) 姿态响应明显滞后，不可用作对照，已回退 EKF。
    ; ★ RATE 模式内环 A/B：关掉 EKF 在线零偏扣除（原版无此步），排除零偏抖动注入速率环。
    -DBFS_NO_EKF_GYRO_BIAS

; 单涵道推进器 + X 型四燃气舵（2026-11-05 首飞成功，默认参数即稳）
; 差异只在 L2 分配与 L3 输出：三轴 α → τ=I·α → 3×4 矩阵 → PA0–PA3 四舵，
; PC8 单推进器油门，PE6 推进使能。
; ★ 烧录纪律：烧错构型 = 舵机/油门映射全错。
; ★ 四舵方向与舵效矩阵未标定，禁止带推进动力测试
;   （见 docs/05-控制与分配/CTL-008-单涵道四燃气舵机型移植-2026-11-05.md 验证阶梯）。
;
; 本机型额外带的三个调试宏（其他两机型暂不带，按需再加）：
;  · BFS_ANOCOM_DIAG         —— 0xF4/0xF5 诊断帧（10Hz/1Hz）
;  · BFS_DBG_USB_SERIAL8     —— USB 调试口（Serial8）也接受 "DBG\n" 进控制台，
;                               没有数传接线时也能做 health/tasks/param 检查
;  · BFS_ANOCOM_ON_USB       —— USB 调试口也承载 AnoCom 上行（可直接插 USB 读改参数，
;                               下行遥测仍只走 Serial6，不会把 USB 刷满）
;  · -U BFS_PROFILE_TO_ANOCOM_SERIAL —— 剖析打印落 Serial8 而非 Serial6，与 DBG 入口同口
;   （否则从 USB 进 DBG 看不到 NAVP/TASK 输出）
[env:SingleEdf4Vane]
extends = env:unignc
build_flags = ${env:unignc.build_flags} -DBFS_SINGLE_EDF_4VANE -DBFS_ANOCOM_DIAG -DBFS_DBG_USB_SERIAL8 -DBFS_ANOCOM_ON_USB -UBFS_PROFILE_TO_ANOCOM_SERIAL
; ★台架旁路宏 BFS_SINGLE_EDF_BENCH_AUTONOMY 已移除（2026-11-05）：它会在 CH5–CH8
;   全无信号时强制解锁，掩盖真实解锁语义（用户实测误以为解锁通道反了）。
;   解锁判据恢复原设计：CH5 > 1500 解锁、<= 1500 上锁。


; ============================================================================
;  ③ IMU 层：+ _ICM45686（缺省 = ICM-42688-P）
; ============================================================================
; 两个后端互相独立、可随意切换 —— 改的是 lib/ICM45686/ 与 lib/ICM42688/ 各自的驱动，
; 上层 imu_factory.cpp 按宏分派，共用同一套 SPI 引脚与 ImuDevice 抽象。
[env:TandemVec_FCS_ICM45686]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DFCS_IMU_MODEL_ICM45686

[env:CoaxialVTVL_ICM45686]
extends = env:CoaxialVTVL
build_flags = ${env:CoaxialVTVL.build_flags} -DFCS_IMU_MODEL_ICM45686

[env:SingleEdf4Vane_ICM45686]
extends = env:SingleEdf4Vane
build_flags = ${env:SingleEdf4Vane.build_flags} -DFCS_IMU_MODEL_ICM45686


; ============================================================================
;  ④ 协议层：+ _MAVLink（缺省 = AnoCom）
; ============================================================================
; BFS_DEFAULT_PROTO_MAVLINK 把**上电默认遥测协议**定为 MAVLink v2，
; 接 QGC / Mission Planner 即用，不必先连 DBG 敲 `proto mavlink`。
; 想临时切回 AnoCom：往数传口发 4 字节 "DBG\n" 进控制台，再 `proto anocom`；
; 或直接刷不带该宏的 env。
; ★ MAVLink 与 AnoCom 共用 Serial6（数传口），USB 调试口不受影响。
[env:TandemVec_FCS_ICM45686_MAVLink]
extends = env:TandemVec_FCS_ICM45686
build_flags = ${env:TandemVec_FCS_ICM45686.build_flags} -DBFS_DEFAULT_PROTO_MAVLINK

[env:CoaxialVTVL_ICM45686_MAVLink]
extends = env:CoaxialVTVL_ICM45686
build_flags = ${env:CoaxialVTVL_ICM45686.build_flags} -DBFS_DEFAULT_PROTO_MAVLINK

[env:SingleEdf4Vane_ICM45686_MAVLink]
extends = env:SingleEdf4Vane_ICM45686
build_flags = ${env:SingleEdf4Vane_ICM45686.build_flags} -DBFS_DEFAULT_PROTO_MAVLINK


; ============================================================================
;  ⑤ 用途层：+ _Flight（缺省 = 调试版）
; ============================================================================
; ★ 实飞版（2026-11-06）：只保留飞行必需，去掉全部调试开销。与调试版差异仅三点：
;   1) 不带 BFS_DBG_USB_SERIAL8 —— USB 口不能再进 DBG 控制台
;      （DBG 会暂停任务并改变时序，上天后不该有这条通路）
;   2) -U BFS_TASK_PROFILE / -U BFS_NAV_PROFILE —— 去掉每任务与导航分段
;      计时的 DWT 累计开销（实测可省 5-8% CPU）
;   3) -U BFS_PROFILE_TO_ANOCOM_SERIAL —— 剖析已关，无输出口需求
;
; 保留的东西（飞行或地面保障必需）：
;   · 2kHz ISR ring + 备份姿态 200Hz（已在 unignc 下沉）
;   · BFS_ANOCOM_ON_USB：USB 口仍可读/写参数
;   · 全部联锁、舵机限幅、解锁判据、故障保护（与调试版逐位一致）
;
; 验证要求：烧录后必须做——①参数读回确认链路通；②0xF4 复核采样率；
;   ③断动力核对四舵方向与限位；④CH5 解锁/上锁语义；⑤倾角保护阈值。
[env:SingleEdf4Vane_Flight]
extends = env:unignc
build_flags = ${env:unignc.build_flags} -DBFS_SINGLE_EDF_4VANE -DBFS_ANOCOM_ON_USB -UBFS_TASK_PROFILE -UBFS_NAV_PROFILE -UBFS_PROFILE_TO_ANOCOM_SERIAL


; ============================================================================
;  新增组合：照抄三行即可（不要复制 unignc 的内容）
; ----------------------------------------------------------------------------
;   例：共轴 + 42688 + MAVLink + 实飞
;     [env:CoaxialVTVL_MAVLink_Flight]
;     extends = env:CoaxialVTVL
;     build_flags = ${env:CoaxialVTVL.build_flags} -DBFS_DEFAULT_PROTO_MAVLINK \
;                   -UBFS_TASK_PROFILE -UBFS_NAV_PROFILE -UBFS_PROFILE_TO_ANOCOM_SERIAL
;
;   可用维度（互不干扰）：
;     机型  : （无宏=纵列） / -DBFS_COAXIAL_VTVL / -DBFS_SINGLE_EDF_4VANE
;     IMU   : （无宏=42688） / -DFCS_IMU_MODEL_ICM45686
;     协议  : （无宏=AnoCom） / -DBFS_DEFAULT_PROTO_MAVLINK
;     用途  : （无宏=调试）  / -UBFS_TASK_PROFILE -UBFS_NAV_PROFILE -UBFS_PROFILE_TO_ANOCOM_SERIAL
;   并记得把新 env 补进文件头的速查表。
; ============================================================================


; ============================================================================
;  ⑥ 板载自检固件（独立于 unignc）
; ----------------------------------------------------------------------------
; 刻意不 extends unignc：它要 -DBFS_DISABLE_IWDG 关掉看门狗、并额外给 C 库
; 的 open/close/lseek/read/write 打空符号（解决 std::ofstream 链接错误），
; 与飞行构建的宏组合差异太大，强行共用只会两边都难读。
;
; ★ 不要用 `pio test -e test` 做回归：本项目所有回归都是宿主测试
;   （g++ 直编，见 test_host/run_all.sh）。`pio run -e test` 只是编译板载自检固件。
;   历史教训：test/ekf_host_regression.cpp（4798 行宿主测试）误放 PlatformIO 的 test/ 下，
;   导致 `pio test` 把固件源码 + 宿主 main() + Unity 框架一起链接而报 ld 错误。
; ============================================================================
[env:test]
platform = ststm32@20.0.0
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
build_flags =
    -mcpu=cortex-m7
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -O3
    -DNDEBUG
    -DTANDEMVEC_FIRMWARE
    -Wall
    -Wno-address-of-packed-member
    -Wno-psabi
    -DSERIAL_RX_BUFFER_SIZE=16384
    -DSERIAL_TX_BUFFER_SIZE=4096
    ; 板载自检不启用 IWDG（避免测试/调试时看门狗复位干扰）
    -DBFS_DISABLE_IWDG
    ; 完整 C 库符号替身（std::ofstream 链接）
    -Wl,--defsym=_open=0
    -Wl,--defsym=_close=0
    -Wl,--defsym=_lseek=0
    -Wl,--defsym=_read=0
    -Wl,--defsym=_write=0
