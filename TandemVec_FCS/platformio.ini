[platformio]
; ★ 2026-11-06 审计修复：必须显式声明默认 env。
;   本文件有 8 个 env，缺 default_envs 时 `pio run` / `pio run -t upload`
;   会依次处理全部 env 并逐个上传，最后一个通常是 CoaxialVTVL_UI ——
;   等于把板子刷成别的机型。当前实机为单涵道四燃气舵。
default_envs = SingleEdf4Vane

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:TandemVec_FCS]
platform = ststm32@20.0.0
; 串口监视器默认波特率（Serial6 地面站口；固件侧 SERIAL6_BAUDRATE 也是 921600）
; ★ 2026-11-06 审计修复：原本误写在 [env:TandemVec_FCS_DTCM] 段内，主 env 用不到
monitor_speed = 921600
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
; upload_protocol = jlink

; 构建优化
build_flags = 
    ; 1. 指定CPU内核为Cortex-M7
    -mcpu=cortex-m7
    ; 2. 指定FPU架构为VFPv5-D16 (支持单精度和双精度)
    -mfpu=fpv5-d16
    ; 3. 启用硬件浮点ABI (必须与硬件FPU配套)
    -mfloat-abi=hard
    ; 4. 可选：启用SIMD指令集优化
    -mvectorize-with-neon-quad
    -O3                  ; 性能优化
    -DNDEBUG            ; 关闭调试
    -DTANDEMVEC_FIRMWARE ; 固件编译：kFlightCtrlParams 为可变唯一实例（见 FlightCtrlParams.h / state_data.cpp）
    -Wall               ; 保留警告 
    -Wno-address-of-packed-member ; MAVLink 生成头会对 packed 数组成员取地址，按第三方库边界定向压制该类噪声
    -Wno-psabi          ; Eigen 模板在 GCC 7.1 后会触发 ARM 参数传递 ABI 提示，属于工具链兼容提示
    -DSERIAL_RX_BUFFER_SIZE=16384 
    -DSERIAL_TX_BUFFER_SIZE=4096
    ; 2kHz 调度器支持小数 tick 间隔。DPS310 上板实测 7.735ms 任务周期
    ; 配合压力优先补读, 贴近 128Hz 压力输出且 300s 内无 FIFO overflow/flush。
    -DBFS_TASK_FRACTIONAL_INTERVALS
    ; 任务调度画像（每 2s 输出 [TASK]/[LOOP] 统计表；仅 DBG 模式下打印，
    ; 输出到 Serial6 由 GCS 控制台读取。task0_period 是 TIM8 实际周期的权威读数）
    -DBFS_TASK_PROFILE
    -DBFS_PROFILE_TO_ANOCOM_SERIAL
    -DBFS_DPS310_FIFO_MAX_READS=2U
    -DBFS_DPS310_STOP_AFTER_PRESSURE_SAMPLE
    ; 硬件看门狗 (IWDG)：启用 HAL IWDG 模块编译（main.cpp 的 initIwdg/kickIwdg）
    -DHAL_IWDG_MODULE_ENABLED
    ; ★2026-10-31 审计 P1-8：_STABILIZE / _PROPAGATION 快速数值路径已从飞行构建移除。
    ;   理由：导航库源码自述该路径“仅 bring-up、闭环前必须重新验证”，而 [env:test]、
    ;   test_host 与 SIL 都不定义这两个宏 —— 移除后飞行二进制与回归基线一致（double 路径）。
    ;   若要恢复（H743 上板实测调度余量不足时），必须先把 float 路径纳入宿主回归并
    ;   加协方差正定性断言，再按下面两行恢复。
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_STABILIZE
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_PROPAGATION
    ; ★2026-11-03 协方差传播中间量改 float：Phi·P·Phiᵀ 与 Simpson Qd 的公式/顺序
    ;   完全不变，只替换中间计算精度（非 FAST_PROPAGATION 近似路径）。
    ;   验证：EKF 116 项回归双路径全过、384 组器件场景同 4 项既有失败；
    ;   上板 cov_avg 5203→966 µs、Navigation avg 5657→1519 µs。
    -DBFS_NAVIGATION_EMBEDDED_FLOAT_COVARIANCE=1
    -DBFS_NAV_PROFILE
	    ; 气压高度 EKF 观测：DPS310 先以起飞点归零，再用 Home WGS84 高度
	    ; 恢复为绝对观测，与 GNSS 共用同一 LLA 高度基准。H=[0,0,1,0,...]。
	    ; 当前仍无独立 baro_bias 状态，长期气压漂移由量测噪声和 NIS 门控约束。
	    -DBFS_EKF_BARO_ALTITUDE_UPDATE
	    -DBFS_EKF_Z_BIAS_TUNING
	    ; ★2026-10-31 审计 P1-5：气压健康门控（Drift/Spike/Stuck → Suspect）在
	    ; 飞行构建中启用。此前宏未定义 ⇒ g_baro_health_gate_enable 恒 false，
	    ; 监测器只写遥测不生效；DPS310 冻结时 baro R=0.1225 仍以约 73:1 权重压过
	    ; GNSS 高度（R≥9），EKF 高度会被冻结值慢慢拖走。
	    -DBFS_BARO_HEALTH_GATE
    ; ★ 2026-11-06 统一下沉（用户要求：导航统一、稳定 2kHz 采样）：
    ;   2kHz TIM8 ISR 单包入 SPSC ring，Navigation 200Hz 按 elapsed 限流排空；
    ;   备份姿态 200Hz 由 BFS_IMU_ATT_DECIMATE 分频。三个机型 env 全部继承，
    ;   不再只有共轴开启。纯轮询回退环境 [env:CoaxialVTVL_UI] 用 -U 显式取消。
    -DBFS_IMU_ISR_RING
    -DBFS_IMU_ATT_DECIMATE
    ; ★2026-11-01 IMU 型号选择（默认不定义 = ICM42688P，保持现役硬件行为不变）。
    ;   换 ICM-45686 时用 [env:TandemVec_FCS_ICM45686]（本文件末尾），
    ;   或手动加 -DFCS_IMU_MODEL_ICM45686。
    ;   ★ ODR：ICM-45686 无 2000Hz 档（序列 ...1600/3200/6400），同一配置会落到
    ;   3200Hz；调度器的 IMU 任务周期与 Madgwick 更新率由 actualAccelOdrHz()
    ;   反推（见 main.cpp），不再写死 2kHz。换型后必须复核 EKF 的 IMU 降采样假设。

; 共轴双桨 VTVL 机型：复用同一板级/任务/导航，仅把 GNC 控制/混控切换为
; CoaxialVtvControl + mapCoaxialVtvOutputs。尚无共轴整机 SIL/台架证据。
[env:CoaxialVTVL]
extends = env:TandemVec_FCS
; P1：2kHz ISR 单包入 ring，Navigation 200Hz 排空；备份姿态200Hz。
; 非 DBG 0xF4 实测 120s mean2024.5/std43.8/ring_drop0；纯轮询回退见 CoaxialVTVL_UI。
; 2kHz ISR ring 与备份姿态分频已下沉到主 env，此处不再重复 -D。
; ★ 纯轮询回退环境：显式 -U 取消主 env 下沉的 2kHz ISR ring，
;   保持「不经 ring、直接轮询采样」的对照语义（仅用于 A/B 回退验证）。
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_COAXIAL_VTVL -UBFS_IMU_ISR_RING -UBFS_IMU_ATT_DECIMATE

; ★2026-11-01 ICM-45686 换型验证环境：与飞行环境同源，仅切换 IMU 后端。
;   用途：编译期验证 45686 路径、以及换硬件前的构建冒烟（不改变默认产物）。
[env:TandemVec_FCS_ICM45686]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DFCS_IMU_MODEL_ICM45686

; 单涵道推进器 + X 型四燃气舵机型（2026-11-05 新增，由 Universal-EDF 移植）。
;   与纵列/共轴共用同一板级/任务/导航/姿态环，差异只在 L2 分配与 L3 输出：
;   三轴 α → τ=I·α → 3×4 矩阵 → PA0–PA3 四舵，PC8 单推进器油门，PE6 推进使能。
;   ★ 烧录纪律：pio run -e SingleEdf4Vane -t upload；烧错构型 = 舵机/油门映射全错。
;   ★ 本机型四舵方向与舵效矩阵均未标定，禁止带推进动力测试（见
;     docs/单涵道四燃气舵机型移植-2026-11-05.md 的验证阶梯）。
[env:SingleEdf4Vane]
extends = env:TandemVec_FCS
; ★BFS_DBG_USB_SERIAL8：USB 调试口（Serial8）也接受 "DBG\n" 进调试台，
;   用于没有数传接线时做 health/tasks/vanes/param 检查与参数标定（命令回显走 USB 口）。
;   默认纵列/共轴构建不含该宏，Serial8 保持纯输出行为。
; ★台架旁路宏 BFS_SINGLE_EDF_BENCH_AUTONOMY 已移除（2026-11-05）：它会在
;   CH5–CH8 全无信号时强制解锁，掩盖真实解锁语义（用户实测误以为解锁通道反了）。
;   解锁判据恢复原设计：CH5 > 1500 解锁、<= 1500 上锁。
; ★BFS_ANOCOM_ON_USB：USB 调试口（Serial8）也承载 AnoCom 上行——匿名上位机直接插
;   USB 就能读参数/改参数（下行遥测仍只走 Serial6 数传，不会把 USB 刷满）。
;   与 BFS_DBG_USB_SERIAL8 共存：0xAB 帧头交给 AnoCom，其余文本行交给 DBG。
; ★ 2026-11-06 开关一致性修复：本机型从 USB 进 DBG（BFS_DBG_USB_SERIAL8），
;   但主 env 的 BFS_PROFILE_TO_ANOCOM_SERIAL 会把剖析打印硬指向 Serial6（数传），
;   导致 USB 调试台看不到 NAVP/TASK 输出。这里 -U 取消，让 BFS_PROFILE_SERIAL 落到
;   Serial8，与 DBG 入口同口。
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_SINGLE_EDF_4VANE -DBFS_ANOCOM_DIAG -DBFS_DBG_USB_SERIAL8 -DBFS_ANOCOM_ON_USB -UBFS_PROFILE_TO_ANOCOM_SERIAL

; ==================================================================
;  ★ 实飞版（2026-11-06）：只保留飞行必需，去掉全部调试开销。
;    与 [env:SingleEdf4Vane] 的差异仅三点：
;    1) 不带 BFS_DBG_USB_SERIAL8 —— USB 口不能再进 DBG 控制台
;       （DBG 会暂停任务并改变时序，上天后不该有这条通路）
;    2) -U BFS_TASK_PROFILE / -U BFS_NAV_PROFILE —— 去掉每任务与导航分段
;       计时的 DWT 累计开销（实测可省 5-8% CPU）
;    3) -U BFS_PROFILE_TO_ANOCOM_SERIAL —— 剖析已关，无输出口需求
;
;    保留的东西（都是飞行或地面保障必需）：
;    - 2kHz ISR ring + 备份姿态 200Hz（已下沉到主 env）
;    - BFS_ANOCOM_ON_USB：USB 口仍可读/写参数，且 0xF4 采样率遥测镜像到 USB，
;      便于地面不接数传时做参数核对与采样率复核
;    - 0xF4/0xF5 诊断帧（10Hz/1Hz，受 BFS_ANOCOM_ON_USB 镜像）
;    - 全部联锁、舵机限幅、解锁判据、故障保护（与调试版逐位一致）
;
;    验证要求：烧录后必须做——①参数读回确认链路通；②0xF4 复核采样率；
;    ③断动力核对四舵方向与限位；④CH5 解锁/上锁语义；⑤倾角保护阈值。
; ==================================================================
[env:SingleEdf4Vane_Flight]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_SINGLE_EDF_4VANE -DBFS_ANOCOM_ON_USB -UBFS_TASK_PROFILE -UBFS_NAV_PROFILE -UBFS_PROFILE_TO_ANOCOM_SERIAL

; 性能 A/B（默认固件不变）：5ms 任务首次相位错开，缓解 tick 集中到期后的
; 标志位合并漏拍（实测 200Hz 仅跑约 155Hz，见 飞控实时性能基线-2026-11-03.md）。
[env:TandemVec_FCS_PHASE]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_TASK_PHASE_STAGGER=1

; 性能 A/B（默认固件不变）：EKF 全状态放 DTCM（0x20000000，0 等待）。
[env:TandemVec_FCS_DTCM]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_NAV_EKF_DTCM=1 -Wl,--section-start=.dtcmram=0x20000000


; 测试环境：使用完整 C 库，解决 std::ofstream 链接错误
[env:test]
platform = ststm32@20.0.0
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
build_flags =
    -mcpu=cortex-m7
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -O3
    -DNDEBUG
    -Wall
    -Wno-address-of-packed-member
    -Wno-psabi
    -DSERIAL_RX_BUFFER_SIZE=16384
    -DSERIAL_TX_BUFFER_SIZE=4096
    ; 板载自检环境不启用 IWDG（避免测试/调试时看门狗复位干扰）
    -DBFS_DISABLE_IWDG
    ; 固件编译：kFlightCtrlParams 为可变唯一实例
    -DTANDEMVEC_FIRMWARE
    -Wl,--defsym=_open=0
    -Wl,--defsym=_close=0
    -Wl,--defsym=_lseek=0
    -Wl,--defsym=_read=0
    -Wl,--defsym=_write=0
test_build_src = true

; 纯轮询回退（无P1/无ISR）；整机回退用此env
[env:CoaxialVTVL_UI]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_COAXIAL_VTVL
