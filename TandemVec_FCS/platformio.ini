; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:TandemVec_FCS]
platform = ststm32@20.0.0
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
; upload_protocol = jlink

; 构建优化
build_flags = 
    ; 1. 指定CPU内核为Cortex-M7
    -mcpu=cortex-m7
    ; 2. 指定FPU架构为VFPv5-D16 (支持单精度和双精度)
    -mfpu=fpv5-d16
    ; 3. 启用硬件浮点ABI (必须与硬件FPU配套)
    -mfloat-abi=hard
    ; 4. 可选：启用SIMD指令集优化
    -mvectorize-with-neon-quad
    -O3                  ; 性能优化
    -DNDEBUG            ; 关闭调试
    -DTANDEMVEC_FIRMWARE ; 固件编译：kFlightCtrlParams 为可变唯一实例（见 FlightCtrlParams.h / state_data.cpp）
    -Wall               ; 保留警告 
    -Wno-address-of-packed-member ; MAVLink 生成头会对 packed 数组成员取地址，按第三方库边界定向压制该类噪声
    -Wno-psabi          ; Eigen 模板在 GCC 7.1 后会触发 ARM 参数传递 ABI 提示，属于工具链兼容提示
    -DSERIAL_RX_BUFFER_SIZE=4096 
    -DSERIAL_TX_BUFFER_SIZE=1024
    ; 2kHz 调度器支持小数 tick 间隔。DPS310 上板实测 7.735ms 任务周期
    ; 配合压力优先补读, 贴近 128Hz 压力输出且 300s 内无 FIFO overflow/flush。
    -DBFS_TASK_FRACTIONAL_INTERVALS
    ; 任务调度画像（每 2s 输出 [TASK]/[LOOP] 统计表；仅 DBG 模式下打印，
    ; 输出到 Serial6 由 GCS 控制台读取。task0_period 是 TIM8 实际周期的权威读数）
    -DBFS_TASK_PROFILE
    -DBFS_PROFILE_TO_ANOCOM_SERIAL
    -DBFS_DPS310_FIFO_MAX_READS=2U
    -DBFS_DPS310_STOP_AFTER_PRESSURE_SAMPLE
    ; 硬件看门狗 (IWDG)：启用 HAL IWDG 模块编译（main.cpp 的 initIwdg/kickIwdg）
    -DHAL_IWDG_MODULE_ENABLED
    ; ★2026-10-31 审计 P1-8：_STABILIZE / _PROPAGATION 快速数值路径已从飞行构建移除。
    ;   理由：导航库源码自述该路径“仅 bring-up、闭环前必须重新验证”，而 [env:test]、
    ;   test_host 与 SIL 都不定义这两个宏 —— 移除后飞行二进制与回归基线一致（double 路径）。
    ;   若要恢复（H743 上板实测调度余量不足时），必须先把 float 路径纳入宿主回归并
    ;   加协方差正定性断言，再按下面两行恢复。
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_STABILIZE
    ; -DBFS_NAVIGATION_EMBEDDED_FAST_PROPAGATION
    -DBFS_NAV_PROFILE
	    ; 气压高度 EKF 观测：DPS310 先以起飞点归零，再用 Home WGS84 高度
	    ; 恢复为绝对观测，与 GNSS 共用同一 LLA 高度基准。H=[0,0,1,0,...]。
	    ; 当前仍无独立 baro_bias 状态，长期气压漂移由量测噪声和 NIS 门控约束。
	    -DBFS_EKF_BARO_ALTITUDE_UPDATE
	    -DBFS_EKF_Z_BIAS_TUNING
	    ; ★2026-10-31 审计 P1-5：气压健康门控（Drift/Spike/Stuck → Suspect）在
	    ; 飞行构建中启用。此前宏未定义 ⇒ g_baro_health_gate_enable 恒 false，
	    ; 监测器只写遥测不生效；DPS310 冻结时 baro R=0.1225 仍以约 73:1 权重压过
	    ; GNSS 高度（R≥9），EKF 高度会被冻结值慢慢拖走。
	    -DBFS_BARO_HEALTH_GATE

; 共轴双桨 VTVL 机型：复用同一板级/任务/导航，仅把 GNC 控制/混控切换为
; CoaxialVtvControl + mapCoaxialVtvOutputs。尚无共轴整机 SIL/台架证据。
[env:CoaxialVTVL]
extends = env:TandemVec_FCS
build_flags = ${env:TandemVec_FCS.build_flags} -DBFS_COAXIAL_VTVL

; 串口监视器配置（Serial8 当前为 921600 baud）
monitor_speed = 921600

; 测试环境：使用完整 C 库，解决 std::ofstream 链接错误
[env:test]
platform = ststm32@20.0.0
board = weact_mini_h743vitx
board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
framework = arduino
upload_protocol = cmsis-dap
build_flags =
    -mcpu=cortex-m7
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -O3
    -DNDEBUG
    -Wall
    -Wno-address-of-packed-member
    -Wno-psabi
    -DSERIAL_RX_BUFFER_SIZE=4096
    -DSERIAL_TX_BUFFER_SIZE=1024
    ; 板载自检环境不启用 IWDG（避免测试/调试时看门狗复位干扰）
    -DBFS_DISABLE_IWDG
    ; 固件编译：kFlightCtrlParams 为可变唯一实例
    -DTANDEMVEC_FIRMWARE
    -Wl,--defsym=_open=0
    -Wl,--defsym=_close=0
    -Wl,--defsym=_lseek=0
    -Wl,--defsym=_read=0
    -Wl,--defsym=_write=0
test_build_src = true
