sentence=Cross-platform WS2812/NeoPixel LED driver for stm32duino with STM32H7 TIM+DMA acceleration.
paragraph=Fixes Adafruit NeoPixel's high-pin BSRR bug (GPIO 8-15 unreachable) and the STM32H7 TIM4_CH4 missing-DMA issue via a TIM Update DMA bypass. Bit-bang works on any pin; TIM+DMA mode is CPU-free on STM32H7. Also compiles on other Arduino platforms via a generic fallback.
