sentence=多款 6 轴 IMU 的型号无关抽象接口（当前覆盖 ICM-42688-P 与 ICM-45686）。
paragraph=只包含接口与配置类型，不含任何芯片实现，也不依赖具体芯片头文件。各芯片的后端实现放在其自己的库内（lib/ICM42688、lib/ICM45686），由固件层按编译期宏选择实例化，因此未被选中的芯片库不会进入固件构建。
